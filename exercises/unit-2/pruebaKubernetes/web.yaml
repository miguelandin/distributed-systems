apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
      containers:
        - name: apache
          image: miguelandin/apache:2.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          env:
            - name: WEB_VERSION
              value: "v1"
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "<h1>Hola desde Kubernetes</h1>
              <p>Pod: $(hostname)</p>
              <p>Version: $WEB_VERSION</p>" \
              > /var/www/html/index.html
              exec apachectl -D FOREGROUND
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
