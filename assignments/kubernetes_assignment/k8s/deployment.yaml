apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpc-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rpc-server
  template:
    metadata:
      labels:
        app: rpc-server
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: rpc-server
      containers:
        - name: rpc-server
          image: miguelandin/rpc-server:1.0
          ports:
            - containerPort: 5000
